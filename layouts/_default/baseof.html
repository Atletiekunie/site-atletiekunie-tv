<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B35 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 200px;
            height: auto;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B35 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/{{ .Site.Params.author.image }}" alt="{{ .Site.Title }}">
        </div>
        
        <h1>{{ .Site.Title }}</h1>
        
        <div class="links">
            {{ range .Site.Params.author.links }}
                {{ range $name, $link := . }}
                    <a href="{{ $link.href }}" class="link-button" target="_blank" rel="noopener noreferrer">
                        {{ if findRE "Archief" $link.text }}
                            🗂️ {{ $link.text }}
                        {{ else }}
                            🎥 {{ $link.text }}
                        {{ end }}
                    </a>
                {{ end }}
            {{ end }}
        </div>
    </div>
</body>
</html>{{ block "main" . }}{{ end }}
